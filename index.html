<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14324f">
<title>RDM Atelier · calculs de résistance</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* VOICE: bureau des méthodes, net et sûr de lui
   IDEA: une fiche de calcul d'atelier — on coche son cas, on remplit, le croquis dit si ça tient
   PICTURE: le croquis de la pièce chargée, qui se déforme, plastifie ou casse selon les chiffres
   COLOUR and TYPE: blanc, encre, bleu acier ; vert / orange / rouge réservés à l'état de la pièce ; IBM Plex
   LAYOUT: liste des cas à gauche, saisie au centre, croquis et résultats à droite ; empilé sur téléphone */
:root{color-scheme:light dark;
--bg:light-dark(#eef1f4,#0f1317);--paper:light-dark(#ffffff,#171c22);--ink:light-dark(#141a21,#e6eaef);--mute:light-dark(#5a6573,#98a3b0);
--line:light-dark(#d8dee5,#28313b);--acc:light-dark(#14558f,#7db4ea);--acc2:light-dark(#e7eff8,#1a2a3b);--steel:light-dark(#a9b6c4,#5c6b7b);
--ok:light-dark(#1f8a4c,#4cc584);--warn:light-dark(#c77700,#f0a940);--bad:light-dark(#c62f22,#ff6a5a);--okbg:light-dark(#e5f4ea,#173023);--warnbg:light-dark(#fdf1df,#36290f);--badbg:light-dark(#fde7e4,#3b1714)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;overflow-x:clip}
button,input,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:14px;padding:10px max(2vw,14px);background:#14324f;color:#fff;flex-wrap:wrap}
header h1{margin:0;font-size:20px;font-weight:700}
header .sub{opacity:.75;font-size:13px;flex:1 1 220px}
.units{display:flex;gap:6px;align-items:center;font-size:13px}
.units select{background:rgba(255,255,255,.14);border:0;border-radius:8px;min-height:38px;padding:0 8px;color:#fff}
.units select option{color:#111}
.wrap{display:grid;grid-template-columns:220px minmax(0,1fr) minmax(0,1.15fr);gap:12px;padding:12px max(2vw,14px);align-items:start}
@media(max-width:1150px){.wrap{grid-template-columns:200px minmax(0,1fr)}.out{grid-column:2}}
@media(max-width:760px){.wrap{grid-template-columns:minmax(0,1fr)}.out{grid-column:auto}}
.cases{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px;position:sticky;top:10px;display:flex;flex-direction:column;gap:2px}
@media(max-width:760px){.cases{position:static;flex-direction:row;overflow-x:auto;scroll-snap-type:x mandatory}}
.cases button{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:9px;padding:8px 10px;min-height:48px;cursor:pointer;text-align:left;color:var(--ink);flex:none;scroll-snap-align:start}
.cases button svg{width:30px;height:30px;flex:none;stroke:currentColor;fill:none;stroke-width:2}
.cases button[aria-current=true]{background:var(--acc2);color:var(--acc);font-weight:600}
.cases button span small{display:block;font-size:11.5px;color:var(--mute);font-weight:400}
@media(max-width:760px){.cases button span small{display:none}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h2{margin:0 0 4px;font-size:clamp(20px,2.4vw,26px);line-height:1.1}
.card .lead{color:var(--mute);margin:0 0 10px;font-size:14px}
h3{font-size:14px;margin:16px 0 8px;color:var(--acc);font-weight:700}
.seek{background:var(--acc2);border-radius:10px;padding:10px;margin:8px 0 4px}
.seek label{font-weight:600;font-size:14px}
.seek select{width:100%;margin-top:6px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:0 10px;font-size:16px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px}
.fld{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mute)}
.fld .in{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:8px;background:var(--paper);overflow:hidden;min-height:44px}
.fld input,.fld select{border:0;background:none;padding:0 10px;font-size:16px;width:100%;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.fld select{text-align:left}
.fld .u{display:flex;align-items:center;padding:0 9px;background:var(--bg);color:var(--mute);font-size:13px;white-space:nowrap}
.fld.unk .in{border-color:var(--acc);border-width:2px;background:var(--acc2)}
.fld.unk input{font-weight:700;color:var(--acc)}
.fld.full{grid-column:1/-1}
.shapes{display:flex;gap:6px;flex-wrap:wrap}
.shapes button{border:1px solid var(--line);background:var(--paper);border-radius:9px;min-height:44px;min-width:44px;padding:4px 10px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:13px}
.shapes button[aria-pressed=true]{border-color:var(--acc);background:var(--acc2);color:var(--acc);font-weight:600}
.shapes svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
.verdict{border-radius:12px;padding:12px 14px;display:flex;gap:14px;align-items:center;margin-bottom:10px}
.verdict b{flex:none;font-size:clamp(22px,3vw,30px);line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.verdict .t{font-weight:700;font-size:16px}.verdict .d{font-size:13.5px}
.v0{background:var(--okbg);color:var(--ok)}.v1{background:var(--warnbg);color:var(--warn)}.v2,.v3,.v4{background:var(--badbg);color:var(--bad)}
.fig{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fig svg{display:block;width:100%;height:auto;touch-action:pan-y}
.gauge{margin:10px 0 4px}
.gauge .track{position:relative;height:16px;border-radius:8px;background:linear-gradient(90deg,var(--okbg),var(--warnbg) 60%,var(--badbg));border:1px solid var(--line)}
.gauge .mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.gauge .cur{position:absolute;top:-6px;width:14px;height:26px;margin-left:-7px;border-radius:4px;background:var(--acc);border:2px solid var(--paper)}
.gauge .lab{position:relative;height:30px;font-size:11.5px;color:var(--mute)}
.gauge .lab span{position:absolute;transform:translateX(-50%);white-space:nowrap;top:6px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
td{padding:6px 4px;border-bottom:1px solid var(--line)}td.n{text-align:right;font:500 14px "IBM Plex Mono",monospace;white-space:nowrap}
tr.em td{font-weight:700}tr.em td.n{color:var(--acc)}
.note{font-size:13px;color:var(--mute);margin:8px 0}
.out .card+.card{margin-top:12px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:9px;min-height:42px;padding:0 14px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none}.toast.on{opacity:1}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
@media(max-width:600px){header .sub{display:none}.fields{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.sheet{position:fixed;inset:0;background:rgba(10,14,20,.55);z-index:40;overflow-y:auto;padding:18px 12px}
.sheet[hidden]{display:none}
.sheet .page{max-width:860px;margin:0 auto;background:var(--paper);border-radius:14px;padding:clamp(16px,3vw,34px);box-shadow:0 12px 40px rgba(0,0,0,.3)}
.sheet .bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:860px;margin:0 auto 10px}
.sheet .bar .btn{background:var(--paper)}
.sh-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:10px;flex-wrap:wrap}
.sh-h h2{margin:0;font-size:clamp(22px,3vw,30px);line-height:1.1}.sh-h p{margin:4px 0 0;color:var(--mute);font-size:13px}
.sh-v{border-radius:10px;padding:8px 12px;font-weight:700;text-align:right}.sh-v b{display:block;font-size:24px}
.sh-fig{margin:14px 0;border:1px solid var(--line);border-radius:10px}.sh-fig svg{display:block;width:100%;height:auto}
.steps{padding-left:26px;margin:0}.steps li{padding:10px 0;border-bottom:1px solid var(--line);break-inside:avoid}
.steps h4{margin:0 0 4px;font-size:15.5px}.steps p{margin:0 0 6px;color:var(--mute);font-size:14px}
.steps .f{font:500 14.5px "IBM Plex Mono",monospace;background:var(--acc2);color:var(--acc);display:inline-block;padding:3px 8px;border-radius:6px}
.steps .sb{font:14px "IBM Plex Mono",monospace;margin-top:5px;overflow-wrap:anywhere}.steps .sb.plain{font:14px/1.6 "IBM Plex Sans",sans-serif}.steps .rs{font:14.5px "IBM Plex Mono",monospace;margin-top:3px}.steps .rs b{color:var(--ink)}
body.sheet-open{overflow:hidden}
@media print{body>*:not(.sheet){display:none!important}.sheet{position:static;background:none;padding:0;overflow:visible}.sheet .bar{display:none}.sheet .page{box-shadow:none;max-width:none;padding:0}body.sheet-open{overflow:visible}}
</style>
</head>
<body>
<header>
  <h1>RDM Atelier</h1>
  <div class="sub">Traction, compression, cisaillement, flexion, torsion et efforts 3D : choisis ton cas, remplis, l'appli trouve ce qui manque.</div>
  <div class="units"><label for="fu">Forces en</label><select id="fu"><option value="1">N</option><option value="10">daN</option><option value="1000">kN</option></select></div>
</header>
<div class="wrap">
  <nav class="cases" id="cases" aria-label="Cas de calcul"></nav>
  <section class="card" id="form"></section>
  <section class="out">
    <div class="card"><div id="verdict"></div><div class="fig" id="fig"></div><div class="gauge" id="gauge"></div></div>
    <div class="card"><h3 style="margin-top:0">Résultats</h3><table id="res"></table><div id="notes"></div>
      <div class="btns"><button class="btn" id="sheetOpen" style="background:var(--acc);color:#fff;border:0;font-weight:600">Feuille de calcul détaillée</button><button class="btn" id="copy">Copier le résumé</button><button class="btn" id="reset">Valeurs par défaut</button></div></div>
  </section>
</div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Feuille de calcul détaillée"><div class="bar"><button class="btn" id="sheetPrint">Imprimer / PDF</button><button class="btn" id="sheetCopy">Copier le texte</button><button class="btn" id="sheetClose">Fermer</button></div><div class="page" id="sheetBody"></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
{
/* ================= données ================= */
const MATS = [
  ["S235 (acier de construction)", 235, 360, 210, 0.3], ["S275", 275, 430, 210, 0.3], ["S355", 355, 490, 210, 0.3],
  ["E295 (A50)", 295, 470, 210, 0.3], ["E335 (A60)", 335, 570, 210, 0.3], ["C45 normalisé", 340, 620, 210, 0.3],
  ["42CrMo4 trempé-revenu", 750, 1000, 210, 0.3], ["Inox 304L", 200, 500, 200, 0.3], ["Inox 316L", 200, 500, 200, 0.3],
  ["Alu 6060 T6", 150, 190, 69, 0.33], ["Alu 6061 T6", 240, 260, 69, 0.33], ["Alu 5083 H111", 125, 275, 71, 0.33],
  ["Alu 2017A T4", 260, 390, 72, 0.33], ["Alu 7075 T6", 460, 540, 72, 0.33], ["Fonte EN-GJS-400-15", 250, 400, 169, 0.27],
  ["Laiton CuZn39Pb3", 250, 400, 100, 0.34], ["Bronze CuSn8", 300, 450, 115, 0.34], ["Titane Ti-6Al-4V", 830, 900, 114, 0.34],
  ["Vis classe 8.8", 640, 800, 210, 0.3], ["Vis classe 10.9", 900, 1000, 210, 0.3], ["Vis classe 12.9", 1080, 1200, 210, 0.3], ["Vis inox A2-70", 450, 700, 200, 0.3],
  ["Personnalisé", 235, 360, 210, 0.3]
];
const SHAPES = {
  rond: { n: "Rond plein", dims: ["d"], ico: '<circle cx="12" cy="12" r="8"/>' },
  tube: { n: "Tube rond", dims: ["D", "e"], ico: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/>' },
  carre: { n: "Carré plein", dims: ["a"], ico: '<rect x="4" y="4" width="16" height="16"/>' },
  rect: { n: "Rectangle / plat", dims: ["b", "h"], ico: '<rect x="3" y="7" width="18" height="10"/>' },
  tuber: { n: "Tube rectangulaire", dims: ["B", "H", "e"], ico: '<rect x="3" y="5" width="18" height="14"/><rect x="7" y="9" width="10" height="6"/>' },
  perso: { n: "Section connue", dims: ["S", "I", "W"], ico: '<path d="M4 6h16M12 6v12M4 18h16"/>' }
};
const DIMS = { d: ["Diamètre d", "mm", 20], D: ["Diamètre ext. D", "mm", 40], e: ["Épaisseur e", "mm", 3], a: ["Côté a", "mm", 20], b: ["Largeur b", "mm", 40], h: ["Hauteur h (sens de la charge)", "mm", 10], B: ["Largeur B", "mm", 40], H: ["Hauteur H (sens de la charge)", "mm", 60], S: ["Aire S", "mm²", 300], I: ["Moment quadratique I", "mm⁴", 20000], W: ["Module W = I/v", "mm³", 2000] };
function section(shape, v) {
  const P = Math.PI;
  if (shape === "rond") { const d = v.d; return { S: P * d * d / 4, I: P * d ** 4 / 64, Imin: P * d ** 4 / 64, W: P * d ** 3 / 32, W2: P * d ** 3 / 32, I0: P * d ** 4 / 32, W0: P * d ** 3 / 16, round: true, ok: d > 0 }; }
  if (shape === "tube") { const D = v.D, d = D - 2 * v.e, I = P * (D ** 4 - d ** 4) / 64; return { S: P * (D * D - d * d) / 4, I, Imin: I, W: I / (D / 2), W2: I / (D / 2), I0: 2 * I, W0: 2 * I / (D / 2), round: true, ok: D > 0 && d >= 0 && v.e > 0 }; }
  if (shape === "carre") { const a = v.a; return { S: a * a, I: a ** 4 / 12, Imin: a ** 4 / 12, W: a ** 3 / 6, W2: a ** 3 / 6, Wt: a ** 3 / (3 + 1.8), ok: a > 0 }; }
  if (shape === "rect") { const b = v.b, h = v.h, mn = Math.min(b, h), mx = Math.max(b, h); return { S: b * h, I: b * h ** 3 / 12, Imin: Math.min(b * h ** 3, h * b ** 3) / 12, W: b * h * h / 6, W2: h * b * b / 6, Wt: mx * mn * mn / (3 + 1.8 * mn / mx), ok: b > 0 && h > 0 }; }
  if (shape === "tuber") { const B = v.B, H = v.H, e = v.e, bi = B - 2 * e, hi = H - 2 * e, I = (B * H ** 3 - bi * hi ** 3) / 12, I2 = (H * B ** 3 - hi * bi ** 3) / 12; return { S: B * H - bi * hi, I, Imin: Math.min(I, I2), W: I / (H / 2), W2: I2 / (B / 2), Wt: 2 * (B - e) * (H - e) * e, ok: bi >= 0 && hi >= 0 && e > 0 }; }
  return { S: v.S, I: v.I, Imin: v.I, W: v.W, W2: v.W, ok: v.S > 0 && v.I > 0 && v.W > 0 };
}
const FIX = [["Articulé – articulé", 1], ["Encastré – libre", 2], ["Encastré – articulé", 0.7], ["Encastré – encastré", 0.5]];
const BEAMS = [
  ["Console, charge au bout", "cF"], ["Console, charge répartie", "cq"], ["2 appuis, charge au milieu", "sF"],
  ["2 appuis, charge décalée", "sFa"], ["2 appuis, charge répartie", "sq"], ["Bi-encastrée, charge au milieu", "eF"], ["Bi-encastrée, charge répartie", "eq"]
];

/* ================= définition des cas ================= */
const MAT_FIELDS = [["mat", "Matériau", "sel"], ["Re", "Limite élastique Re", "MPa", 235], ["Rm", "Résistance à la rupture Rm", "MPa", 360], ["E", "Module d'Young E", "GPa", 210], ["s", "Coefficient de sécurité s", "", 2]];
const CASES = [
  { id: "traction", n: "Traction", sub: "barre, tirant, élingue", ico: '<path d="M3 12h4M17 12h4M7 8h10v8H7z"/><path d="M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/>',
    lead: "Une barre tirée dans son axe. Contrainte σ = F / S, comparée à Re / s.",
    fields: [["F", "Effort de traction F", "F", 20000], ["L", "Longueur L", "mm", 1000]], shape: "rond", solv: ["F", "dims", "Re"] },
  { id: "compression", n: "Compression", sub: "poteau, vérin, entretoise + flambement", ico: '<path d="M12 3v4M12 17v4M8 7h8v10H8z"/><path d="M12 7l-3-3M12 7l3-3M12 17l-3 3M12 17l3 3"/>',
    lead: "Écrasement σ = F / S et flambement (Euler, ou Johnson pour les pièces trapues).",
    fields: [["F", "Effort de compression F", "F", 20000], ["L", "Longueur L", "mm", 800], ["fix", "Liaisons aux extrémités", "fix"]], shape: "tube", solv: ["F", "dims", "L", "Re"] },
  { id: "cisaillement", n: "Cisaillement", sub: "axe, goupille, boulon, rivet", ico: '<path d="M4 9h16M4 15h16"/><path d="M12 4v16" stroke-dasharray="3 2"/>',
    lead: "Effort perpendiculaire à l'axe : τ = F / (n · k · S), comparé à Rg / s.",
    fields: [["F", "Effort transmis F", "F", 15000], ["n", "Sections cisaillées par organe", "nsel"], ["k", "Nombre d'organes (boulons…)", "", 1], ["crit", "Résistance au glissement Rg", "crit"]], shape: "rond", solv: ["F", "dims", "k", "Re"] },
  { id: "flexion", n: "Flexion", sub: "poutre, console, potence", ico: '<path d="M3 9h18"/><path d="M3 9c6 6 12 6 18 0" stroke-dasharray="3 2"/><path d="M12 3v5"/>',
    lead: "Place les charges où tu veux sur la poutre : une charge ponctuelle et/ou une charge répartie (constante ou qui varie). σ = Mf / W au point le plus chargé, plus la flèche.",
    fields: [["sup", "Appuis", "sup"], ["L", "Portée L", "mm", 1000], ["F", "Charge ponctuelle F (0 = aucune)", "F", 2000], ["pa", "Position de F (depuis la gauche)", "mm", 1000], ["q1", "Charge répartie au début q₁", "q", 0], ["q2", "Charge répartie à la fin q₂", "q", 0], ["x1", "Début de la charge répartie", "mm", 0], ["x2", "Fin de la charge répartie", "mm", 1000], ["fl", "Flèche admissible L /", "", 250]], shape: "rect", dimsDef: { b: 40, h: 60 }, solv: ["F", "qs", "dims", "L", "Re"] },
  { id: "torsion", n: "Torsion", sub: "arbre, axe moteur, clé", ico: '<path d="M3 12h18"/><path d="M6 7a5 5 0 0 0 0 10M18 7a5 5 0 0 1 0 10"/>',
    lead: "τ = C / W₀ et angle de torsion θ = C·L / (G·I₀). Couple direct ou puissance + vitesse.",
    fields: [["mode", "Je connais", "tmode"], ["C", "Couple C", "Nm", 200], ["P", "Puissance P", "kW", 7.5], ["N", "Vitesse de rotation N", "tr/min", 1450], ["L", "Longueur de l'arbre L", "mm", 500], ["crit", "Résistance au glissement Rg", "crit"], ["th", "Angle admissible (0 = ignoré)", "°/m", 0]], shape: "rond", round: true, dimsDef: { d: 35 }, solv: ["C", "P", "dims", "Re"] },
  { id: "efforts3d", n: "Force 3D", sub: "force quelconque sur un bras encastré", ico: '<path d="M4 20V6M4 20h14M4 20l9-7"/><path d="M13 13l7-7M20 6h-4M20 6v4"/>',
    lead: "Une force dans l'espace appliquée au bout d'un bras encastré. L'appli la décompose sur x, y, z, calcule les efforts à l'encastrement et la contrainte équivalente.",
    fields: [["L", "Longueur du bras (axe x)", "mm", 400], ["oy", "Décalage du point d'appui en y", "mm", 0], ["oz", "Décalage du point d'appui en z", "mm", 80], ["F", "Force F", "F", 1500], ["al", "Angle dans le plan horizontal (depuis x)", "°", 90], ["be", "Angle de la force avec l'horizontale", "°", -60], ["crit", "Critère", "crit3"]], shape: "rond", dimsDef: { d: 40 }, solv: ["F", "dims", "L", "Re"] }
];

/* ================= état ================= */
const KEY = "rdm-atelier-v1";
let fu = 1, cur = "traction", ST = {};
function defState(c) {
  const v = { mat: 0, Re: 235, Rm: 360, E: 210, s: 2, shape: c.shape, unk: "none" };
  c.fields.forEach(f => { if (f[3] !== undefined) v[f[0]] = f[3]; });
  Object.keys(DIMS).forEach(k => v[k] = DIMS[k][2]);
  Object.assign(v, c.dimsDef || {});
  v.fix = 0; v.n = 1; v.crit = 0; v.cas = 0; v.mode = 0; v.sup = 0; v.qs = 1;
  if (c.id === "compression") { v.D = 40; v.e = 3; }
  return v;
}
try { const o = JSON.parse(localStorage.getItem(KEY) || "{}"); ST = o.ST || {}; fu = o.fu || 1; cur = o.cur || cur; } catch (e) {}
CASES.forEach(c => { ST[c.id] = Object.assign(defState(c), ST[c.id] || {}); });
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ ST, fu, cur })); } catch (e) {} };

    if (L < 3) s += `<rect x="${x1}" y="${y - t}" width="${x2 - x1}" height="${2 * t}" rx="4" fill="${col}" opacity=".25" stroke="${col}" stroke-width="2"/>`;
    else if (L === 3) s += `<path d="M${x1} ${y - t} H290 Q320 ${y - t + 14} 350 ${y - t} H${x2} V${y + t} H350 Q320 ${y + t - 14} 290 ${y + t} H${x1}Z" fill="${col}" opacity=".25" stroke="${col}" stroke-width="2"/>` + txt(320, y - t - 12, "striction", { c: col, s: 13 });
    else s += `<path d="M${x1} ${y - t} H290 Q305 ${y - t + 16} 312 ${y - 6} L306 ${y} L313 ${y + 6} Q305 ${y + t - 16} 290 ${y + t} H${x1}Z" fill="${col}" opacity=".3" stroke="${col}" stroke-width="2"/><path d="M${x2} ${y - t} H352 Q337 ${y - t + 16} 330 ${y - 6} L336 ${y} L329 ${y + 6} Q337 ${y + t - 16} 352 ${y + t} H${x2}Z" fill="${col}" opacity=".3" stroke="${col}" stroke-width="2"/>` + txt(321, y - t - 12, "rupture", { c: col, s: 14, w: 700 });
    s += arrow(x1, y, 50, y, "var(--acc)", 4) + arrow(x2, y, 590, y, "var(--acc)", 4) + txt(70, y - 14, `F = ${nf(F)} ${fn}`, { a: "start", s: 13 }) + txt(570, y - 14, "F", { s: 13 });
    s += `<line x1="${x1}" y1="${y + t + 30}" x2="${x2}" y2="${y + t + 30}" stroke="var(--mute)"/>` + txt((x1 + x2) / 2, y + t + 50, `L = ${nf(v.L)} mm`, { c: "var(--mute)", s: 13 });
    s += txt(320, y + 5, `σ = ${nf(r.sig)} MPa`, { w: 700 });
  }
  if (c.id === "compression") {
    const x = 320, y1 = 60, y2 = 290, t = 18, K = r.fig.K, buck = r.fig.mode === "flambement";
    const amp = Math.min(70, 6 + r.fig.uF * (L >= 3 && buck ? 60 : 18));
    const shape = u => K === 1 ? Math.sin(Math.PI * u) : K === 2 ? 1 - Math.cos(Math.PI / 2 * (1 - u)) : K === 0.5 ? (1 - Math.cos(2 * Math.PI * u)) / 2 : Math.sin(Math.PI * (1 - u)) * (1 - u) * 1.7;
    let path = "", path2 = "";
    for (let k = 0; k <= 30; k++) { const u = k / 30, yy = y1 + (y2 - y1) * u, dx = shape(u) * amp; path += `${k ? "L" : "M"}${x + dx - t} ${yy} `; path2 = `L${x + dx + t} ${yy} ` + path2; }
    if (buck || L < 3) s += `<path d="${path}${path2.replace(/^L/, "L")}Z" fill="${col}" opacity=".25" stroke="${col}" stroke-width="2"/>`;
    else s += `<path d="M${x - t} ${y1} Q${x - t - 22} ${(y1 + y2) / 2} ${x - t} ${y2} H${x + t} Q${x + t + 22} ${(y1 + y2) / 2} ${x + t} ${y1}Z" fill="${col}" opacity=".25" stroke="${col}" stroke-width="2"/>`;
    s += `<rect x="${x - t}" y="${y1}" width="${2 * t}" height="${y2 - y1}" fill="none" stroke="var(--mute)" stroke-dasharray="5 4"/>`;
    const fixTxt = FIX[v.fix][0].split(" – ");
    const sym = (yy, typ, top) => typ === "Encastré" ? hatch(x - 50, top ? yy - 16 : yy, 100, 16, false) : `<path d="M${x} ${yy} l-16 ${top ? -20 : 20} h32z" fill="none" stroke="var(--ink)" stroke-width="2"/><circle cx="${x}" cy="${yy}" r="5" fill="var(--paper)" stroke="var(--ink)" stroke-width="2"/>`;
    s += sym(y2, fixTxt[0], false);
    if (fixTxt[1] !== "libre") s += sym(y1, fixTxt[1], true);
    const topx = x + shape(0) * amp;
    s += arrow(topx, 10, topx, y1 - (fixTxt[1] === "Encastré" ? 18 : 4), "var(--acc)", 4) + txt(topx + 16, 30, `F = ${nf(F)} ${fn}`, { a: "start", s: 13 });
    s += txt(470, 170, buck ? (L >= 3 ? "flambement" : "risque : flambement") : (L >= 3 ? "écrasement" : "risque : écrasement"), { c: col, w: 700, a: "start" });
    s += txt(470, 192, `σ = ${nf(r.sig)} MPa`, { a: "start", s: 13 });
  }
  if (c.id === "cisaillement") {
    const dbl = r.fig.n === 2, broke = L >= 4, off = broke ? 18 : L === 3 ? 6 : 0;
    const plates = dbl ? [[90, 0], [140, 1], [190, 0]] : [[110, 0], [170, 1]];
    plates.forEach(([y, mv]) => { const dx = mv ? off : 0; s += `<rect x="${110 + (mv ? 120 : 0) + dx}" y="${y}" width="300" height="46" rx="4" fill="var(--steel)" opacity=".45" stroke="var(--mute)"/>`; });
    const top = plates[0][0] - 18, bot = plates[plates.length - 1][0] + 46 + 18;
    plates.forEach(([y, mv], i) => { const dx = mv ? off : 0; s += `<rect x="${300 + dx}" y="${i === 0 ? top : y}" width="40" height="${i === 0 ? y - top + 46 : i === plates.length - 1 ? bot - y : 46}" fill="${col}" opacity=".45" stroke="${col}" stroke-width="2"/>`; });
    for (let i = 0; i + 1 < plates.length; i++) { const yy = plates[i][0] + 46 + (plates[i + 1][0] - plates[i][0] - 46) / 2 + 2; s += `<line x1="270" y1="${yy}" x2="370" y2="${yy}" stroke="var(--bad)" stroke-width="2" stroke-dasharray="6 4"/>`; }
    plates.forEach(([y, mv]) => { s += mv ? arrow(530, y + 23, 610, y + 23, "var(--acc)", 4) : arrow(110, y + 23, 30, y + 23, "var(--acc)", 4); });
    s += txt(560, plates[1][0] + 5, `F${dbl ? "" : ""}`, { s: 13 }) + txt(320, bot + 30, broke ? "rupture par cisaillement" : L === 3 ? "l'axe se déforme" : "plan(s) de cisaillement", { c: broke || L === 3 ? col : "var(--mute)", w: 700 });
    s += txt(320, 40, `τ = ${nf(r.sig)} MPa${r.fig.k > 1 ? " · " + r.fig.k + " organes" : ""}`, { w: 700 });
  }
  if (c.id === "flexion") {
    const B = r.fig.B, x1 = 70, x2 = 570, y = 142, X = x => x1 + (x2 - x1) * x / B.L;
    const amp = Math.min(55, 10 + B.fmax / B.L * 4000), fm = B.fmax || 1;
    let p = "";
    B.xs.forEach((x, i) => { p += `${i ? "L" : "M"}${X(x).toFixed(1)} ${(y + B.Y[i] / fm * amp).toFixed(1)}`; });
    s += `<rect x="${x1}" y="${y - 10}" width="${x2 - x1}" height="20" fill="none" stroke="var(--mute)" stroke-dasharray="5 4"/>`;
    s += `<path d="${p}" fill="none" stroke="${col}" stroke-width="16" stroke-linecap="round" opacity=".55"/>`;
    if (B.sup === 0) s += hatch(x1 - 22, y - 50, 22, 100, true);
    else if (B.sup === 2) s += hatch(x1 - 22, y - 50, 22, 100, true) + hatch(x2, y - 50, 22, 100, true);
    else s += `<path d="M${x1} ${y + 12} l-14 24 h28z" fill="none" stroke="var(--ink)" stroke-width="2"/><path d="M${x2} ${y + 12} l-14 24 h28z" fill="none" stroke="var(--ink)" stroke-width="2"/><circle cx="${x2 - 7}" cy="${y + 42}" r="4" fill="none" stroke="var(--ink)"/><circle cx="${x2 + 7}" cy="${y + 42}" r="4" fill="none" stroke="var(--ink)"/>` + txt(x1, y + 58, "A", { s: 13 }) + txt(x2, y + 62, "B", { s: 13 });
    if (B.Fq) {
      const qm = Math.max(Math.abs(B.q1), Math.abs(B.q2)) || 1, hq = q => 14 + 34 * Math.abs(q) / qm, top = x => y - 14 - hq(B.q1 + (B.q2 - B.q1) * (x - B.x1) / (B.x2 - B.x1));
      s += `<path d="M${X(B.x1)} ${y - 14} L${X(B.x1)} ${top(B.x1)} L${X(B.x2)} ${top(B.x2)} L${X(B.x2)} ${y - 14}Z" fill="var(--acc)" opacity=".12"/><line x1="${X(B.x1)}" y1="${top(B.x1)}" x2="${X(B.x2)}" y2="${top(B.x2)}" stroke="var(--acc)" stroke-width="2"/>`;
      const n = Math.max(2, Math.round((X(B.x2) - X(B.x1)) / 40));
      for (let k = 0; k <= n; k++) { const x = B.x1 + (B.x2 - B.x1) * k / n; s += arrow(X(x), top(x), X(x), y - 13, "var(--acc)", 2); }
      s += txt((X(B.x1) + X(B.x2)) / 2, Math.min(top(B.x1), top(B.x2)) - 8, `q ${nf(B.q1 * 1000 / fu)} → ${nf(B.q2 * 1000 / fu)} ${fn}/m`, { s: 12.5 });
    }
    if (B.F) { const xx = X(B.a); s += `<g class="grab" style="cursor:ew-resize">` + arrow(xx, y - 86, xx, y - 14, "var(--ink)", 4) + `<circle cx="${xx}" cy="${y - 92}" r="9" fill="var(--acc)" stroke="var(--paper)" stroke-width="2"/></g>` + txt(xx, y - 106, `F = ${nf(F)} ${fn} · a = ${nf(B.a)} mm`, { s: 12.5, w: 600 }); }
    const yM = 272, Mm = Math.max(...B.M.map(Math.abs), B.MA || 0, 1); let pm = `M${x1} ${yM}`;
    B.xs.forEach((x, i) => { pm += ` L${X(x).toFixed(1)} ${(yM - B.M[i] / Mm * 44).toFixed(1)}`; });
    s += `<path d="${pm} L${x2} ${yM}Z" fill="var(--acc)" opacity=".18" stroke="var(--acc)"/><line x1="${x1}" y1="${yM}" x2="${x2}" y2="${yM}" stroke="var(--ink)"/>` + txt(x1, yM + 54, "moment fléchissant", { a: "start", s: 12, c: "var(--mute)" }) + txt(x2, yM + 54, `|Mf| maxi ${nf(B.Mmax / 1000)} N·m à x = ${nf(B.xM)} mm`, { a: "end", s: 12, c: "var(--mute)" });
    if (L >= 3) { const i = B.xs.indexOf(B.xM), cx = X(B.xM), cy = y + (B.Y[i] || 0) / fm * amp; s += `<path d="M${cx - 6} ${cy + 10} l6 -8 l-4 -6 l6 -8" stroke="var(--bad)" stroke-width="3" fill="none"/>` + txt(Math.min(Math.max(cx, 110), 530), cy + 38, L === 4 ? "rupture ici" : "plastification ici", { c: col, w: 700, s: 13 }); }
    s += txt(320, 18, `σ maxi = ${nf(r.sig)} MPa · flèche ${nf(B.fmax)} mm`, { w: 700 });
  }
  if (c.id === "torsion") {
    const x1 = 140, x2 = 500, y = 160, R = 42, tw = Math.min(70, 8 + Math.abs(r.fig.th) * 8);
    s += `<rect x="${x1}" y="${y - R}" width="${x2 - x1}" height="${2 * R}" fill="${col}" opacity=".2" stroke="${col}" stroke-width="2"/><ellipse cx="${x1}" cy="${y}" rx="14" ry="${R}" fill="var(--paper)" stroke="${col}" stroke-width="2"/><ellipse cx="${x2}" cy="${y}" rx="14" ry="${R}" fill="none" stroke="${col}" stroke-width="2" stroke-dasharray="4 3"/>`;
    for (let k = -1; k <= 1; k++) { const y0 = y + k * R * 0.6; s += `<path d="M${x1} ${y0} L${x2} ${Math.max(y - R, Math.min(y + R, y0 + tw * (k === 0 ? 1 : 0.6)))}" stroke="var(--ink)" stroke-width="1.6" fill="none"/>`; s += `<line x1="${x1}" y1="${y0}" x2="${x2}" y2="${y0}" stroke="var(--mute)" stroke-dasharray="3 4"/>`; }
    const curl = (cx, dir) => `<path d="M${cx} ${y - R - 18} A 24 ${R + 18} 0 0 ${dir} ${cx} ${y + R + 18}" fill="none" stroke="var(--acc)" stroke-width="4"/>` + arrow(cx, y + R + 12, cx + (dir ? -14 : 14), y + R + 22, "var(--acc)", 3);
    s += curl(x1 - 34, 0) + curl(x2 + 34, 1);
    if (L >= 4) s += `<path d="M320 ${y - R} l-10 22 l14 14 l-12 22 l10 26" stroke="var(--bad)" stroke-width="3" fill="none"/>` + txt(320, y + R + 46, "rupture", { c: col, w: 700 });
    else if (L === 3) s += txt(320, y + R + 46, "déformation permanente", { c: col, w: 700 });
    s += txt(320, 46, `τ = ${nf(r.sig)} MPa · torsion ${nf(r.fig.th)}°`, { w: 700 });
  }
  if (c.id === "efforts3d") {
    const g = r.fig, O = [150, 220], sc = 300 / Math.max(g.x, 1), P = (x, y, z) => [O[0] + x * sc - y * sc * 0.45, O[1] + y * sc * 0.3 - z * sc];
    const ax = (to, lab) => { const p = P(...to); return arrow(O[0], O[1], p[0], p[1], "var(--mute)", 1.5) + txt(p[0] + 10, p[1] + 4, lab, { s: 13, c: "var(--mute)", a: "start" }); };
    s += hatch(O[0] - 30, O[1] - 90, 30, 140, true);
    s += ax([g.x * 1.25, 0, 0], "x") + ax([0, Math.max(60, g.x * 0.35), 0], "y") + ax([0, 0, Math.max(60, g.x * 0.3)], "z");
    const e = P(g.x, 0, 0), p = P(g.x, g.y, g.z);
    s += `<line x1="${O[0]}" y1="${O[1]}" x2="${e[0]}" y2="${e[1]}" stroke="${col}" stroke-width="18" stroke-linecap="round" opacity=".55"/>`;
    s += `<line x1="${e[0]}" y1="${e[1]}" x2="${p[0]}" y2="${p[1]}" stroke="var(--steel)" stroke-width="10" stroke-linecap="round"/>`;
    const Fm = Math.hypot(g.Fx, g.Fy, g.Fz) || 1, k = 110 / Fm;
    const tip = [p[0] + (g.Fx * k) - (g.Fy * k) * 0.45, p[1] + (g.Fy * k) * 0.3 - g.Fz * k];
    [[g.Fx, 0, 0, "Fx"], [0, g.Fy, 0, "Fy"], [0, 0, g.Fz, "Fz"]].forEach(([a, b, cz, lb]) => { if (Math.abs(a + b + cz) < Fm * 0.02) return; const q = [p[0] + a * k - b * k * 0.45, p[1] + b * k * 0.3 - cz * k]; s += `<g stroke-dasharray="5 4">${arrow(p[0], p[1], q[0], q[1], "var(--mute)", 2)}</g>` + txt(q[0] + 8, q[1] - 6, lb, { s: 12, c: "var(--mute)", a: "start" }); });
    s += arrow(p[0], p[1], tip[0], tip[1], "var(--acc)", 4) + txt(tip[0] + 10, tip[1], `F = ${nf(F)} ${fn}`, { s: 13, a: "start", w: 700 });
    s += txt(O[0] - 10, O[1] + 80, `Mt ${nf(g.Mx / 1000)} · My ${nf(g.My / 1000)} · Mz ${nf(g.Mz / 1000)} N·m`, { s: 12.5, a: "start" });
    if (L >= 3) s += `<path d="M${O[0] + 6} ${O[1] - 14} l6 8 l-5 6 l6 8" stroke="var(--bad)" stroke-width="3" fill="none"/>` + txt(O[0] + 40, O[1] - 30, L === 4 ? "rupture à l'encastrement" : "plastification à l'encastrement", { c: col, w: 700, s: 13, a: "start" });
    s += txt(320, 30, `σ équivalente = ${nf(r.sig)} MPa`, { w: 700 });
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Schéma du cas ${c.n} : ${LEVEL_TXT[r.lvl][0]}">${s}</svg>`;
}

/* ================= rendu des résultats ================= */
let last = null;
function run() {
  const c = caseOf(cur), v = ST[cur], unk = v.unk;
  let solved = null;
  if (unk !== "none") {
    solved = solve(c, v, unk);
    if (solved !== null) { if (unk === "qs") { v.q1 *= solved; v.q2 *= solved; v.qs = 1; } else v[unk] = unk === "k" ? Math.ceil(solved - 1e-9) : solved; }
  }
  const r = compute(c, v);
  if (r.bad) { $("verdict").innerHTML = `<div class="verdict v2"><div><div class="t">Données incohérentes</div><div class="d">${r.bad}</div></div></div>`; $("res").innerHTML = ""; $("fig").innerHTML = ""; $("gauge").innerHTML = ""; return; }
  last = { c, v, r, unk, solved };
  const ut = r.util;
  let vtxt = LEVEL_TXT[r.lvl];
  let head = `<div class="verdict v${r.lvl}"><b>${Math.round(ut * 100)} %</b><div><div class="t">${vtxt[0]}</div><div class="d">${vtxt[1]} Taux d'utilisation de la limite admissible.</div></div></div>`;
  if (unk !== "none") {
    const lab = unk === "Re" ? "Re mini" : unk in DIMS ? DIMS[unk][0].split(" (")[0] + " mini" : UNK_LAB[unk];
    const unit = unk === "qs" ? fuName() + "/m" : unk === "F" ? fuName() : unk in DIMS ? DIMS[unk][1] : unk === "C" ? "N·m" : unk === "P" ? "kW" : unk === "L" ? "mm" : unk === "Re" ? "MPa" : "";
    if (solved === null) head = `<div class="verdict v2"><div><div class="t">Pas de solution</div><div class="d">Aucune valeur de « ${lab} » ne permet de respecter la limite avec ces données.</div></div></div>`;
    else {
      let extra = "";
      if (unk === "Re") { const ok = MATS.slice(0, -1).filter(m => m[1] >= v[unk]).map(m => m[0]).slice(0, 4); extra = ok.length ? `<div class="d">Exemples qui conviennent : ${ok.join(", ")}.</div>` : `<div class="d">Aucune nuance de la liste ne suffit.</div>`; }
      if (unk in DIMS && unk !== "S" && unk !== "I" && unk !== "W") extra = `<div class="d">Prends la dimension du commerce juste au-dessus.</div>`;
      head = `<div class="verdict v0"><b>${unk === "qs" ? nf(Math.max(v.q1, v.q2)) + " " + fuName() + "/m" : nf(v[unk]) + " " + unit}</b><div><div class="t">${lab}</div><div class="d">Valeur qui amène la pièce pile à la limite admissible (s = ${nf(v.s)}).</div>${extra}</div></div>`;
      const inp = $("f-" + unk); if (inp) inp.value = nf(v[unk], 5).replace(/\s/g, "");
      if (unk === "qs") ["q1", "q2"].forEach(k => { const e = $("f-" + k); if (e) e.value = nf(v[k], 5).replace(/\s/g, ""); });
    }
  }
  $("verdict").innerHTML = head;
  $("fig").innerHTML = figure(c, r, v);
  // jauge
  const isShear = c.id === "cisaillement" || c.id === "torsion";
  const Rlim = isShear ? (v.crit == 1 ? 0.577 : 0.5) * v.Re : v.Re, Rrup = isShear ? 0.6 * v.Rm : v.Rm, adm = Rlim / v.s;
  const mx = Math.max(Rrup * 1.15, r.sig * 1.05), pc = x => Math.min(100, x / mx * 100);
  let l1 = Math.max(10, pc(adm)), l2 = Math.max(pc(Rlim), l1 + 22), l3 = Math.max(pc(Rrup), l2 + 24);
  if (l3 > 90) { const d = l3 - 90; l3 -= d; l2 = Math.min(l2, l3 - 24); l1 = Math.min(l1, l2 - 22); }
  $("gauge").innerHTML = `<div class="track" role="img" aria-label="Contrainte ${nf(r.sig)} MPa sur une échelle allant jusqu'à la rupture"><span class="mk" style="left:${pc(adm)}%"></span><span class="mk" style="left:${pc(Rlim)}%"></span><span class="mk" style="left:${pc(Rrup)}%"></span><span class="cur" style="left:${pc(r.sig)}%"></span></div>
    <div class="lab"><span style="left:${l1}%">admissible ${nf(adm)}</span><span style="left:${l2}%">${isShear ? "Rg" : "Re"} ${nf(Rlim)}</span><span style="left:${l3}%">rupture ${nf(Rrup)}</span></div>`;
  $("res").innerHTML = r.rows.map(([l, val, u, em]) => `<tr class="${em ? "em" : ""}"><td>${l}</td><td class="n">${nf(val)} ${u}</td></tr>`).join("");
  $("notes").innerHTML = r.notes.map(n => `<p class="note">${n}</p>`).join("");
  save();
}

/* ================= feuille de calcul détaillée ================= */
function explain(c, v, r, unk, solved) {
  const fn = fuName(), k = fu, E = v.E * 1000, F = (v.F || 0) * fu, sec = r.sec, st = [];
  const N = x => nf(x, 4);
  const step = (t, txt, f, sub, res) => st.push({ t, txt, f, sub, res });
  // 1. données
  const dims = SHAPES[v.shape].dims.map(d => `${d} = ${N(v[d])} ${DIMS[d][1]}`).join(" ; ");
  let data = [];
  if (v.F !== undefined && c.id !== "torsion" && c.id !== "flexion") data.push(`Effort F = ${N(v.F)} ${fn}${fu !== 1 ? ` = ${N(F)} N` : ""}`);
  if (c.id === "torsion") data.push(v.mode == 1 ? `Puissance P = ${N(v.P)} kW ; vitesse N = ${N(v.N)} tr/min` : `Couple C = ${N(v.C)} N·m = ${N(v.C * 1000)} N·mm`);
  if (["traction", "compression", "flexion", "torsion", "efforts3d"].includes(c.id)) data.push(`Longueur L = ${N(v.L)} mm`);
  if (c.id === "compression") data.push(`Liaisons : ${FIX[v.fix][0]}`);
  if (c.id === "cisaillement") data.push(`Sections cisaillées par organe n = ${v.n} ; nombre d'organes k = ${Math.max(1, Math.round(v.k))}`);
  if (c.id === "flexion") data.push(`Appuis : ${SUPS[+v.sup || 0]}`, `Charge ponctuelle F = ${N(v.F)} ${fn} à a = ${N(v.pa)} mm`, `Charge répartie : q₁ = ${N(v.q1)} ${fn}/m → q₂ = ${N(v.q2)} ${fn}/m, de x₁ = ${N(v.x1)} à x₂ = ${N(v.x2)} mm (1 ${fn}/m = ${N(fu / 1000)} N/mm)`);
  if (c.id === "efforts3d") data.push(`Point d'application : x = ${N(v.L)} ; y = ${N(v.oy)} ; z = ${N(v.oz)} mm`, `Direction : α = ${N(v.al)}° dans le plan horizontal, β = ${N(v.be)}° avec l'horizontale`);
  data.push(`Section : ${SHAPES[v.shape].n} (${dims})`, `Matériau : ${MATS[v.mat][0]} ; Re = ${N(v.Re)} MPa ; Rm = ${N(v.Rm)} MPa ; E = ${N(v.E)} GPa = ${N(E)} MPa`, `Coefficient de sécurité demandé s = ${N(v.s)}`);
  const uval = unk === "qs" ? `q₁ = ${N(v.q1)} → q₂ = ${N(v.q2)} ${fn}/m` : `${N(v[unk])} ${unkUnit(unk)}`;
  if (unk !== "none" && solved !== null) data.push(`<b>Valeur trouvée par l'appli :</b> ${unkLabel(unk)} = ${uval} (voir la dernière étape)`);
  step("Données", "Unités : longueurs en mm, forces en N, contraintes en MPa (1 MPa = 1 N/mm²), moments en N·mm.", null, data.join("<br>"), null);
  // 2. section
  const sh = v.shape, P = "π";

    step("Élancement", "Plus il est grand, plus la pièce flambe facilement.", "λ = Lf / i", `${N(Lf)} / ${N(i)}`, N(lam));

    step("Taux retenu", "On garde le plus défavorable des deux.", "taux = max(écrasement ; flambement)", `max(${N(uC * 100)} % ; ${N(uF * 100)} %)`, `${N(r.util * 100)} % (${r.mode})`);

    step("Contrainte normale (effort N = Fx)", "", "σ_N = N / S", `${N(g.Fx)} / ${N(sec.S)}`, `${N(sN)} MPa`);

    if (sec.round) { const Mf = Math.hypot(g.My, g.Mz); sM = Mf / sec.W; tau = Math.abs(g.Mx) / sec.W0; step("Moment de flexion résultant", "Section ronde : les deux flexions se combinent.", "Mf = √(My² + Mz²)", `√(${N(g.My)}² + ${N(g.Mz)}²)`, `${N(Mf)} N·mm`); step("Contrainte de flexion", "", "σ_f = Mf / W", `${N(Mf)} / ${N(sec.W)}`, `${N(sM)} MPa`); step("Contrainte de torsion", "", "τ = |Mt| / W₀", `${N(Math.abs(g.Mx))} / ${N(sec.W0)}`, `${N(tau)} MPa`); }

    step("Taux d'utilisation", "", "taux = σ_eq / (Re / s)", `${N(r.sig)} / ${N(Rpe)}`, `${N(r.util * 100)} %`);
    step("Force maxi admissible (même direction)", "Les contraintes sont proportionnelles à F.", "F_max = F / taux", `${N(F)} / ${N(r.util)}`, `${N(F / r.util)} N`);
  }
  // 4. inconnue
  if (unk !== "none" && solved !== null) {
    let how = "L'appli fait varier cette valeur (méthode par dichotomie) jusqu'à ce que le taux d'utilisation vaille exactement 100 %. Toutes les étapes ci-dessus sont recalculées avec la valeur trouvée.";
    let f = "taux(" + unkLabel(unk) + ") = 100 %";
    if (c.id === "traction" && unk === "F") { f = "F_max = (Re / s) · S"; }
    if (c.id === "traction" && unk === "d") { f = "S_min = F · s / Re  puis  d = √(4 · S_min / π)"; how = "Calcul direct. " + how; }

    if (unk === "qs") how = "L'appli multiplie q₁ et q₂ par un même coefficient (dichotomie) jusqu'à ce que le taux d'utilisation vaille 100 %. ";
    step("Comment l'inconnue a été trouvée", how, f, "", `${unkLabel(unk)} = ${uval}`);
  }
  step("Conclusion", LEVEL_TXT[r.lvl][1], null, "", `${LEVEL_TXT[r.lvl][0]} · taux ${N(r.util * 100)} % · coefficient de sécurité réel ${N(r.util > 0 ? v.s / r.util : Infinity)}`);
  return st;
}
const unkLabel = u => u === "Re" ? "Re mini" : u in DIMS ? DIMS[u][0].split(" (")[0] : (UNK_LAB[u] || u);
const unkUnit = u => u === "qs" ? fuName() + "/m" : u === "F" ? fuName() : u in DIMS ? DIMS[u][1] : u === "C" ? "N·m" : u === "P" ? "kW" : u === "L" ? "mm" : u === "Re" ? "MPa" : "";
function openSheet() {
  if (!last) return;
  const { c, v, r, unk, solved } = last;
  const st = explain(c, v, r, unk, solved);
  const d = new Date().toLocaleDateString("fr-FR");
  $("sheetBody").innerHTML = `<div class="sh-h"><div><h2>Feuille de calcul · ${c.n}</h2><p>RDM Atelier · ${d}</p></div><div class="sh-v v${r.lvl}">${LEVEL_TXT[r.lvl][0]}<b>${Math.round(r.util * 100)} %</b></div></div>
    <div class="sh-fig">${figure(c, r, v)}</div>
    <ol class="steps">${st.map(s => `<li><h4>${s.t}</h4>${s.txt ? `<p>${s.txt}</p>` : ""}${s.f ? `<div class="f">${s.f}</div>` : ""}${s.sub ? `<div class="sb${s.f ? "" : " plain"}">${s.f ? "= " : ""}${s.sub}</div>` : ""}${s.res ? `<div class="rs">= <b>${s.res}</b></div>` : ""}</li>`).join("")}</ol>
    <p class="note">Outil de pré-dimensionnement. Valeurs matière typiques : à vérifier sur la fiche de la nuance utilisée.</p>`;
  $("sheet").hidden = false; document.body.classList.add("sheet-open");
  $("sheetClose").focus();
}
function sheetText() {
  const { c, v, r, unk, solved } = last;
  const strip = h => String(h || "").replace(/<br>/g, "\n   ").replace(/<[^>]+>/g, "");
  return [`FEUILLE DE CALCUL · ${c.n}`, ""].concat(explain(c, v, r, unk, solved).map((s, i) => `${i + 1}. ${s.t}` + (s.txt ? `\n   ${strip(s.txt)}` : "") + (s.f ? `\n   ${strip(s.f)}` : "") + (s.sub ? `\n   ${s.f ? "= " : ""}${strip(s.sub)}` : "") + (s.res ? `\n   = ${strip(s.res)}` : ""))).join("\n\n");
}

/* ================= évènements ================= */
function setCase(id) { cur = id; renderCases(); renderForm(); run(); }
$("cases").addEventListener("click", e => { const b = e.target.closest("button[data-c]"); if (b) setCase(b.dataset.c); });
$("form").addEventListener("input", e => {
  const t = e.target, k = t.dataset.k; if (!k || t.tagName !== "INPUT") return;
  const x = parseFloat(t.value.replace(",", ".").replace(/\s/g, "")); if (!isFinite(x)) return;
  const v = ST[cur];
  v[k] = k === "F" || k === "C" || k === "P" || k === "N" || k === "L" || k in DIMS || k === "Re" || k === "Rm" || k === "E" || k === "s" || k === "k" || k === "fl" || k === "th" || k === "a" || k === "al" || k === "be" || k === "oy" || k === "oz" ? x : x;
  document.querySelectorAll(`#form [data-k="${k}"]`).forEach(el => { if (el !== t && el.tagName === "INPUT") el.value = el.type === "range" ? x : nf(x, 5).replace(/\s/g, ""); });
  if (k === "L" && $("r-a")) { $("r-a").max = x; $("r-a").step = Math.max(1, x / 200); }
  if (k === "Re" || k === "Rm" || k === "E") { v.mat = MATS.length - 1; const s = document.querySelector('select[data-k="mat"]'); if (s) s.value = v.mat; }
  run();
});
$("form").addEventListener("change", e => {
  const t = e.target, v = ST[cur];
  if (t.id === "unk") { v.unk = t.value; renderForm(); run(); return; }
  const k = t.dataset.k; if (!k || t.tagName !== "SELECT") return;
  const x = +t.value;
  if (k === "mat") { v.mat = x; const m = MATS[x]; if (x < MATS.length - 1) { v.Re = m[1]; v.Rm = m[2]; v.E = m[3]; v.nu = m[4]; } renderForm(); run(); return; }
  if (k === "n") v.n = x + 1; else v[k] = x;
  renderForm(); run();
});
$("form").addEventListener("click", e => { const b = e.target.closest("button[data-shape]"); if (!b) return; const v = ST[cur]; v.shape = b.dataset.shape; if (v.unk in DIMS) v.unk = "none"; renderForm(); run(); });
$("form").addEventListener("focusin", e => { const t = e.target; if (t.tagName === "INPUT" && !t.readOnly) setTimeout(() => t.select(), 0); });
$("fu").value = String(fu);
$("fu").addEventListener("change", e => { const nfu = +e.target.value; CASES.forEach(c => { const v = ST[c.id]; v.F = v.F * fu / nfu; if (c.id === "flexion") { v.q1 = (v.q1 || 0) * fu / nfu; v.q2 = (v.q2 || 0) * fu / nfu; } }); fu = nfu; renderForm(); run(); });
$("reset").addEventListener("click", () => { ST[cur] = defState(caseOf(cur)); ST[cur].F = (ST[cur].F || 0) / fu; renderForm(); run(); toast("Valeurs par défaut remises"); });
$("copy").addEventListener("click", async () => {
  if (!last) return;
  const { c, v, r } = last;
  const lines = [`RDM Atelier · ${c.n}`, `Section : ${SHAPES[v.shape].n} (${SHAPES[v.shape].dims.map(d => d + " = " + nf(v[d]) + " " + DIMS[d][1]).join(", ")})`, `Matériau : ${MATS[v.mat][0]} · Re ${nf(v.Re)} MPa · Rm ${nf(v.Rm)} MPa · s = ${nf(v.s)}`, `Verdict : ${LEVEL_TXT[r.lvl][0]} (${Math.round(r.util * 100)} % de l'admissible)`, ""].concat(r.rows.map(([l, x, u]) => `${l || "  "} : ${nf(x)} ${u}`));
  try { await navigator.clipboard.writeText(lines.join("\n")); toast("Fiche copiée"); } catch (e) { toast("Copie bloquée par le navigateur"); }
});
CASES.forEach(c => { if (ST[c.id].nu === undefined) ST[c.id].nu = 0.3; });
let dragF = false;
const dragTo = e => { const svg = $("fig").querySelector("svg"); if (!svg) return; const b = svg.getBoundingClientRect(), xs = (e.clientX - b.left) / b.width * 640, v = ST.flexion; v.pa = Math.round(Math.min(1, Math.max(0, (xs - 70) / 500)) * v.L / 5) * 5; document.querySelectorAll('#form [data-k="pa"]').forEach(el => el.value = el.type === "range" ? v.pa : String(v.pa)); run(); };
$("fig").addEventListener("pointerdown", e => { if (cur !== "flexion" || !ST.flexion.F || !e.target.closest(".grab, svg")) return; const svg = $("fig").querySelector("svg"), b = svg.getBoundingClientRect(); if ((e.clientY - b.top) / b.height * 340 > 165) return; dragF = true; $("fig").setPointerCapture(e.pointerId); dragTo(e); });
$("fig").addEventListener("pointermove", e => { if (dragF) dragTo(e); });
$("fig").addEventListener("pointerup", () => { dragF = false; }); $("fig").addEventListener("pointercancel", () => { dragF = false; });
$("sheetOpen").addEventListener("click", openSheet);
const closeSheet = () => { $("sheet").hidden = true; document.body.classList.remove("sheet-open"); $("sheetOpen").focus(); };
$("sheetClose").addEventListener("click", closeSheet);
$("sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheet").hidden) closeSheet(); });
$("sheetPrint").addEventListener("click", () => { try { window.print(); } catch (e) { toast("Impression bloquée ici : utilise « Copier le texte »"); } });
$("sheetCopy").addEventListener("click", async () => { try { await navigator.clipboard.writeText(sheetText()); toast("Feuille copiée"); } catch (e) { toast("Copie bloquée par le navigateur"); } });
renderCases(); renderForm(); run();
if ("serviceWorker" in navigator && location.protocol === "https:" && !/claude|anthropic/.test(location.hostname)) navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
